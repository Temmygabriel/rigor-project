name: ci

# Runs on GitHub's cloud runners so local (8GB) machines don't pay for
# npm install / typecheck / build. Every branch push and PR gets verified here.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next.config.mjs ignores types during build, so typecheck explicitly:
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
